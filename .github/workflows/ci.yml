name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Use the official Playwright image — browsers & all system deps are pre-installed.
    # This completely eliminates the slow/hung `playwright install --with-deps` step.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        env:
          CI: true
          # Tell Playwright to use the browsers already installed in the Docker image
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: npm run test

      - name: Generate Allure Report
        if: always()
        run: npm run allure:generate

      - name: Upload Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-node-${{ matrix.node-version }}
          if-no-files-found: ignore
          path: |
            reports/allure-results
            reports/allure-report
            reports/cucumber-report.html
            reports/cucumber-report.json
          retention-days: 30


